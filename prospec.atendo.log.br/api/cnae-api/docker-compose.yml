version: '3.8'

services:
  cnae-api:
    build: .
    container_name: cnae-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./app/data:/app/data
    environment:
      - PORT=5000
      - CNAE_DB_PATH=/app/data/cnae.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

