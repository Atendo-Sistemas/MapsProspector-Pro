<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Sem conexão | Maps Prospector</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; }
    main { width: min(100%, 430px); padding: 32px; border: 1px solid #dbeafe; border-radius: 28px; background: #ffffff; box-shadow: 0 22px 55px rgba(15, 23, 42, .10); text-align: center; }
    .icon { width: 68px; height: 68px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 22px; background: #2563eb; color: #fff; font-size: 30px; font-weight: 900; }
    h1 { margin: 0 0 12px; font-size: 1.35rem; line-height: 1.2; }
    p { margin: 0; color: #475569; font-size: .95rem; line-height: 1.55; }
    button { width: 100%; margin-top: 24px; border: 0; border-radius: 14px; padding: 14px 18px; background: #2563eb; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    button:active { transform: scale(.98); }
    @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } main { background: #172033; border-color: #334155; } p { color: #cbd5e1; } }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">M</div>
    <h1>Você está sem conexão</h1>
    <p>Para proteger sua conta e manter os dados atualizados, pesquisas, créditos, histórico e exportações precisam de internet.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
